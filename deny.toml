# cargo-deny license configuration.
# FFmpeg itself is LGPL-2.1-or-later (dynamically linked, shipped separately);
# Rust dependencies must be permissive enough for LGPL distribution.

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "CC0-1.0",
  "LGPL-2.1-or-later",
  "MPL-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
