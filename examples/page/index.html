<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>PlayPlugin 手动测试页</title>
<style>
  body { font-family: system-ui, sans-serif; background: #111; color: #eee; margin: 2rem; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .cam { aspect-ratio: 16/9; background: #222; border: 1px dashed #555; position: relative; cursor: pointer; }
  .cam.sel { border: 2px solid #4af; box-shadow: 0 0 8px #4af inset; }
  .cam .tag { position: absolute; left: 6px; top: 6px; font-size: 12px; color: #9cf; z-index: 3; pointer-events: none; }
  .cam .ctrl { position: absolute; right: 6px; bottom: 6px; z-index: 3; }
  #banner { background: #7a2020; padding: 12px; border-radius: 8px; margin-bottom: 1rem; display: none; }
  #banner a { color: #fff; }
  button { padding: 4px 10px; }
  input { width: 40ch; }
</style>
</head>
<body>
<div id="banner">
  未检测到 PlayPlugin。<a id="dl" href="/play-plugin/PlayPlugin.msi">点击下载安装</a>，安装后本页会自动连接。
</div>
<h2>PlayPlugin Overlay 手动测试</h2>
<p>
  <input id="url" value="rtsp://admin:password@192.168.1.64:554/Streaming/Channels/101">
  <button id="openSel">在选中宫格播放</button>
  <button id="closeSel">关闭选中</button>
  <button id="closeAll">全部关闭</button>
  <button id="conceal">隐藏浮层 2 秒</button>
  <span style="color:#888">（单击选中宫格，双击直接播放）</span>
</p>
<div class="grid" id="grid"></div>
<pre id="log" style="color:#9f9"></pre>

<script type="module">
  // 手动测试时用 vite/静态服务直接引 src：
  //   cd sdk && npx tsc && 在页面 import "./sdk/dist/index.js"
  import { detectPlugin, OverlayPlayer, downloadUrl } from "../../sdk/dist/index.js";

  const N = 16; // 默认 4x4 = 16 宫格
  const log = (m) => { document.getElementById("log").textContent += m + "\n"; };
  document.getElementById("dl").href = downloadUrl;

  const info = await detectPlugin();
  if (!info) {
    document.getElementById("banner").style.display = "block";
  } else {
    log(`插件已安装: v${info.version}, protocol=${info.protocol}`);
  }

  // 单选：同一时刻只有一个选中格
  let sel = null; // cells[i] = { el, player: OverlayPlayer | null }
  const cells = [];
  const grid = document.getElementById("grid");
  for (let i = 0; i < N; i++) {
    const div = document.createElement("div");
    div.className = "cam";
    div.innerHTML = `<span class="tag">cam-${i}</span><span class="ctrl"><button>抓图</button></span>`;
    grid.appendChild(div);
    const cell = { el: div, player: null };
    div.onclick = () => select(cell);
    div.ondblclick = () => playCell(cell);
    div.querySelector("button").onclick = async (e) => {
      e.stopPropagation();
      if (cell.player) log("snapshot: " + await cell.player.snapshot());
    };
    cells.push(cell);
  }
  function select(cell) {
    if (sel) sel.el.classList.remove("sel");
    sel = cell;
    cell.el.classList.add("sel");
  }
  select(cells[0]);

  function tagOf(i) { return cells[i].el.querySelector(".tag"); }
  function bindEvents(cell, i) {
    cell.player.on("state", (s) => log(`cam-${i} state=${s.state} ${s.message ?? ""}`));
    cell.player.on("info", (s) => log(`cam-${i} ${s.width}x${s.height} ${s.codec} [${s.decoder}]`));
    cell.player.on("stats", (s) => { tagOf(i).textContent = `cam-${i} ${s.fps.toFixed(1)}fps ${s.decoder}`; });
  }

  async function closeCell(cell) {
    if (cell.player) { await cell.player.close(); cell.player = null; }
    tagOf(cells.indexOf(cell)).textContent = `cam-${cells.indexOf(cell)}`;
  }

  async function playCell(cell) {
    const i = cells.indexOf(cell);
    await closeCell(cell);
    const url = document.getElementById("url").value;
    cell.player = new OverlayPlayer({ url, mount: cell.el, muted: true });
    bindEvents(cell, i);
    await cell.player.open();
  }

  async function closeAll() { for (const c of cells) await closeCell(c); }

  document.getElementById("openSel").onclick = () => playCell(sel);
  document.getElementById("closeSel").onclick = () => closeCell(sel);
  document.getElementById("closeAll").onclick = closeAll;
  document.getElementById("conceal").onclick = () => {
    for (const c of cells) if (c.player) c.player.conceal();
    setTimeout(() => { for (const c of cells) if (c.player) c.player.reveal(); }, 2000);
  };
</script>
</body>
</html>
